# DNS del resolver interno de Docker (necesario para resolución dinámica de contenedores)
resolver 127.0.0.11 valid=30s;

# --- GZIP COMPRESSION & MOBILE OPTIMIZATIONS ---
gzip on;
gzip_disable "msie6";
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rss+xml
    application/vnd.geo+json
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/opentype
    image/bmp
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/css
    text/plain
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/x-cross-domain-policy;

# --- REDIRECT HTTP TO HTTPS ---
server {
    listen 80;
    server_name tierraviva.com.mx www.tierraviva.com.mx msambar.com www.msambar.com staging.msambar.com www.staging.msambar.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 1. TIERRA VIVA (PRODUCTION HTTPS) ---
server {
    listen 443 ssl;
    server_name tierraviva.com.mx www.tierraviva.com.mx;

    ssl_certificate /etc/letsencrypt/live/tierraviva.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tierraviva.com.mx/privkey.pem;

    # Variables para evitar crashes de Nginx si los contenedores no están activos al iniciar
    set $tv_be http://tierra-viva-backend-1:8000;
    set $tv_fe http://tierra-viva-frontend-1:3000;

    location /static/ {
        alias /app/tierraviva_static/;
    }

    location /media/ {
        alias /app/tierraviva_media/;
    }

    location ~ ^/(api|admin) {
        proxy_pass $tv_be$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $tv_fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

