name: ms-ambar-prod
services:
  backend:
    container_name: ambar_backend
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    volumes:
      - static_volume:/staticfiles
      - media_volume:/media_files
    environment:
      - PYTHONUNBUFFERED=1
      - STATIC_ROOT=/staticfiles
      - MEDIA_ROOT=/media_files
    env_file:
      - .env
    restart: always
    networks:
      - default
      - prod_network

  frontend:
    container_name: ambar_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://msambar.com/api}
    env_file:
      - .env
    restart: always
    networks:
      - default
      - prod_network

volumes:
  static_volume:
    name: ambar_static_volume
  media_volume:
    name: ambar_media_volume

networks:
  prod_network:
    external: true
  default:
    name: ms-ambar_default
