<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block email_title %}Ms Ambar{% endblock %}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap');

    body,
    table,
    td,
    a {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>

<body
  style="background-color: #080C0A; color: #F4F6F0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; padding: 40px 20px; margin: 0; -webkit-font-smoothing: antialiased;">
  <div
    style="max-width: 600px; margin: 0 auto; background: #0B0F0D; border: 1px solid rgba(229, 169, 59, 0.12); padding: 40px; border-radius: 32px; box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 50px rgba(229, 169, 59, 0.02);">

    <!-- Header/Logo -->
    <div style="text-align: center; margin-bottom: 40px;">
      <div
        style="display: inline-block; width: 60px; height: 60px; background-color: #080C0A; border: 1px solid rgba(229, 169, 59, 0.35); border-radius: 50%; overflow: hidden; text-align: center; padding: 6px; box-sizing: border-box; box-shadow: 0 0 20px rgba(229, 169, 59, 0.12); vertical-align: middle;">
        <img src="{{ frontend_url|default:'https://msambar.dev' }}/logos/ms_ambar_monograma_b.png" alt="A"
          style="width: 100%; height: 100%; object-fit: contain; display: block; margin: 0 auto;" />
      </div>
      <h1
        style="color: #F4F6F0; font-size: 26px; font-weight: 900; letter-spacing: -0.05em; margin-top: 15px; margin-bottom: 5px; text-transform: uppercase; font-style: italic;">
        Ms Ambar</h1>
      <div
        style="height: 1px; width: 40px; bg-color: rgba(229, 169, 59, 0.3); background-color: rgba(229, 169, 59, 0.3); margin: 8px auto;">
      </div>
      <p
        style="color: #E5A93B; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; margin: 0;">
        {% block subtitle %}Club Exclusivo{% endblock %}</p>
    </div>

    <!-- Content Area -->
    <div style="font-size: 15px; line-height: 1.8; color: rgba(244, 246, 240, 0.85);">
      {% block content %}
      {% endblock %}
    </div>

    <!-- Footer -->
    <div
      style="text-align: center; border-top: 1px solid rgba(244, 246, 240, 0.06); padding-top: 25px; margin-top: 45px; color: rgba(244, 246, 240, 0.35); font-size: 11px; line-height: 1.6;">
      <p style="margin: 0 0 10px 0; font-weight: 500;">Este es un mensaje automático del club oficial de Ms Ambar.</p>
      <p style="margin: 0;">
        {% block footer_links %}
        <a href="{{ frontend_url|default:'https://msambar.dev' }}"
          style="color: #E5A93B; text-decoration: none; border-bottom: 1px solid rgba(229, 169, 59, 0.25); font-weight: 700; margin: 0 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px;">Sitio
          Web</a>
        <a href="{{ frontend_url|default:'https://msambar.dev' }}/blog"
          style="color: #E5A93B; text-decoration: none; border-bottom: 1px solid rgba(229, 169, 59, 0.25); font-weight: 700; margin: 0 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px;">Club
          Exclusivo</a>
        {% endblock %}
      </p>

      <!-- Premium Watermark Signature -->
      <p
        style="margin: 30px 0 0 0; font-size: 8px; color: rgba(244, 246, 240, 0.15); letter-spacing: 2px; text-transform: uppercase; font-weight: bold;">
        Diseñado con alma por <a href="https://nectarlabs.dev" target="_blank"
          style="color: rgba(229, 169, 59, 0.45); text-decoration: none; border-bottom: 1px solid rgba(229, 169, 59, 0.2); font-weight: 800; transition: all 0.3s;">Nectar
          Labs</a>
      </p>
    </div>

  </div>
</body>

</html>
